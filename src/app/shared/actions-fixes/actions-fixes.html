@if (!pageCible()) {
  <div
    class="barre"
    [class.barre--visible]="barreVisible()"
    [attr.aria-hidden]="barreVisible() ? null : 'true'"
    [attr.inert]="barreVisible() ? null : ''"
  >
    @if (pageFormation()) {
      <a class="bouton barre__principal" [routerLink]="demande.lien" [fragment]="demande.fragment"
        >Demander une formation</a
      >
    } @else {
      <a
        class="bouton barre__principal"
        [href]="planity"
        target="_blank"
        rel="noopener"
        aria-label="Réserver un soin sur Planity (nouvel onglet)"
        >Réserver un soin</a
      >
    }
    @if (whatsapp) {
      <a
        class="barre__whatsapp"
        [href]="whatsapp"
        target="_blank"
        rel="noopener"
        aria-label="Écrire sur WhatsApp (nouvel onglet)"
      >
        <ng-container *ngTemplateOutlet="iconeWhatsapp" />
      </a>
    }
  </div>
}

@if (whatsapp) {
  <a
    class="whatsapp-flottant"
    [class.whatsapp-flottant--masque-mobile]="barreVisible() && !pageCible()"
    [href]="whatsapp"
    target="_blank"
    rel="noopener"
    aria-label="Écrire sur WhatsApp (nouvel onglet)"
  >
    <ng-container *ngTemplateOutlet="iconeWhatsapp" />
  </a>
}

<ng-template #iconeWhatsapp>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" focusable="false">
    <path
      fill="currentColor"
      d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3Z"
    />

</ng-template>
